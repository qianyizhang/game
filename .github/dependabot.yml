version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development:
        dependency-type: development
    ignore:
      # 1.64.1 misses the hosted Canvas send click after resize on macOS.
      # Reassess later releases with test:browser:canvas; 1.63.0 passes that journey.
      - dependency-name: '@playwright/test'
        versions: ['1.64.1']
      # Keep declarations aligned with the pinned Node 24 runtime.
      - dependency-name: '@types/node'
        versions: ['>=25']
      # typescript-eslint 8.71.2 supports TypeScript below 6.1.
      # Lift this ceiling together with the parser, after the full gate passes.
      - dependency-name: typescript
        versions: ['>=6.1']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
