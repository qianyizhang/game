name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      unit: ${{ steps.select.outputs.unit }}
      unit_matrix: ${{ steps.select.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - id: select
        run: npm run ci -- plan
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_FULL: ${{ github.event_name != 'pull_request' && '1' || '0' }}

  core:
    uses: ./.github/workflows/check-core.yml

  application:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    uses: ./.github/workflows/check-application.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      shards: ${{ needs.plan.outputs.unit_matrix }}

  assets:
    needs: plan
    uses: ./.github/workflows/asset-build.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  gate:
    if: always()
    needs: [plan, core, application, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: node packages/workshop-tools/ci/gate.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: >-
            {"plan":"${{ needs.plan.result }}","core":"${{ needs.core.result }}","application":"${{ needs.application.result }}","assets":"${{ needs.assets.result }}"}
