name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Include exhaustive public browser, campaign and geometry validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Release callers must select comprehensive validation
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      documentation: ${{ steps.select.outputs.documentation }}
      core: ${{ steps.select.outputs.core }}
      application: ${{ steps.select.outputs.application }}
      assets: ${{ steps.select.outputs.assets }}
      unit_matrix: ${{ steps.select.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: classify
        run: node packages/workshop-tools/ci/docs-fast.ts classify
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL: ${{ inputs.full && '1' || '0' }}
      # A fresh cache verifies registry URLs before downstream jobs reuse caches.
      - if: steps.classify.outputs.fast != 'true'
        run: npm ci --cache "$RUNNER_TEMP/npm-install-cache"
      - id: select
        run: |
          if [ "$DOCS_FAST" = true ]; then
            node packages/workshop-tools/ci/docs-fast.ts plan
          else
            npm run ci -- plan
          fi
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL: ${{ inputs.full && '1' || '0' }}
          DOCS_FAST: ${{ steps.classify.outputs.fast }}

  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node packages/workshop-tools/ci/docs-fast.ts check
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  core:
    needs: plan
    if: needs.plan.outputs.core == 'true'
    uses: ./.github/workflows/check-core.yml

  application:
    needs: plan
    if: needs.plan.outputs.application == 'true'
    uses: ./.github/workflows/check-application.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      shards: ${{ needs.plan.outputs.unit_matrix }}

  assets:
    needs: plan
    if: needs.plan.outputs.assets == 'true'
    uses: ./.github/workflows/asset-build.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  gate:
    if: always()
    needs: [plan, documentation, core, application, assets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node packages/workshop-tools/ci/gate.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: >-
            {"plan":"${{ needs.plan.result }}","documentation":"${{ needs.documentation.result }}","core":"${{ needs.core.result }}","application":"${{ needs.application.result }}","assets":"${{ needs.assets.result }}"}
