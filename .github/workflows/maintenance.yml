name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Include exhaustive public browser, campaign and geometry validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Release callers must select comprehensive validation
        type: boolean
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      documentation: ${{ steps.select.outputs.documentation }}
      core: ${{ steps.select.outputs.core }}
      movies: ${{ steps.select.outputs.movies }}
      reused: ${{ steps.reuse.outputs.reused }}
      base: ${{ steps.base.outputs.base }}
      application: ${{ steps.select.outputs.application }}
      assets: ${{ steps.select.outputs.assets }}
      unit_matrix: ${{ steps.select.outputs.unit_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: base
        run: node packages/workshop-tools/ci/base.ts
        env:
          CI_FULL: ${{ inputs.full && '1' || '0' }}
      - id: classify
        run: node packages/workshop-tools/ci/docs-fast.ts classify
        env:
          CI_BASE: ${{ steps.base.outputs.base }}
          CI_FULL: ${{ inputs.full && '1' || '0' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.classify.outputs.fast != 'true'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .node-version
      - if: steps.classify.outputs.fast != 'true'
        run: node packages/workshop-tools/ci/integrity.ts metadata
      # A fresh registry fetch is required only when install inputs change or for full validation.
      - if: steps.classify.outputs.fast != 'true'
        run: |
          if [ "$COLD_INSTALL" = true ]; then
            npm ci --cache "$RUNNER_TEMP/npm-install-cache"
            # Publish the validated download payloads, not an empty default cache.
            mkdir -p "$(npm config get cache)"
            cp -a "$RUNNER_TEMP/npm-install-cache/_cacache" "$(npm config get cache)/"
          else
            npm ci
          fi
        env:
          COLD_INSTALL: ${{ steps.base.outputs.cold }}
      - id: select
        run: |
          if [ "$DOCS_FAST" = true ]; then
            node packages/workshop-tools/ci/docs-fast.ts plan
          else
            npm run ci -- plan
          fi
        env:
          CI_BASE: ${{ steps.base.outputs.base }}
          CI_FULL: ${{ inputs.full && '1' || '0' }}
          DOCS_FAST: ${{ steps.classify.outputs.fast }}
      - id: reuse
        if: steps.select.outputs.core == 'true' && inputs.full != true
        run: node packages/workshop-tools/ci/reuse.ts check
        env:
          CI_PLAN: ${{ steps.select.outputs.plan }}
          GITHUB_TOKEN: ${{ github.token }}

  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node packages/workshop-tools/ci/docs-fast.ts check
        env:
          CI_BASE: ${{ needs.plan.outputs.base }}

  core:
    needs: [plan, integrity]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.core == 'true' &&
          (needs.plan.outputs.reused != 'true' || needs.integrity.outputs.reused != 'true') }}
    uses: ./.github/workflows/check-core.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  application:
    needs: [plan, integrity]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.application == 'true' &&
          (needs.plan.outputs.reused != 'true' || needs.integrity.outputs.reused != 'true') }}
    uses: ./.github/workflows/check-application.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      shards: ${{ needs.plan.outputs.unit_matrix }}

  assets:
    needs: [plan, integrity]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.assets == 'true' &&
          (needs.plan.outputs.reused != 'true' || needs.integrity.outputs.reused != 'true') }}
    uses: ./.github/workflows/asset-build.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  movies:
    needs: [plan, integrity]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.movies == 'true' &&
          (needs.plan.outputs.reused != 'true' || needs.integrity.outputs.reused != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .node-version
      - uses: ./.github/actions/environment
      - run: npm ci
      - run: npm run format:check
      - uses: ./.github/actions/hosted-deps
        with:
          profile: media
      - run: node --test packages/workshop-tools/art/movies.test.ts packages/workshop-tools/art/golden-claw.test.ts

  integrity:
    needs: plan
    if: needs.plan.outputs.reused == 'true'
    outputs:
      reused: ${{ steps.environment.outputs.matching }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .node-version
      - uses: ./.github/actions/environment
        id: environment
      - run: npm ci
      - run: npm run format:maintenance && npm run assets:check
      - uses: ./.github/actions/hosted-deps
      - run: npm run test:browser:smoke
        timeout-minutes: 5

  gate:
    if: always()
    needs: [plan, documentation, core, movies, application, assets, integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node packages/workshop-tools/ci/gate.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_REUSED: ${{ needs.integrity.outputs.reused }}
          CI_RESULTS: >-
            {"plan":"${{ needs.plan.result }}","documentation":"${{ needs.documentation.result }}","core":"${{ needs.core.result }}","application":"${{ needs.application.result }}","assets":"${{ needs.assets.result }}","movies":"${{ needs.movies.result }}","integrity":"${{ needs.integrity.result }}"}
      - run: node packages/workshop-tools/ci/reuse.ts receipt
        if: github.event_name == 'pull_request'
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: ignore
          retention-days: 2
