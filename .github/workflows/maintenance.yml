name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: style
            command: npm run format:check && npm run lint:tools && npm run lint:app
          - scope: types
            command: npm run typecheck && npm run check:python
          - scope: rules-1
            command: npm run test -- --shard=1/2
          - scope: rules-2
            command: npm run test -- --shard=2/2
          - scope: simulations
            command: npm run playtest
          - scope: tools
            command: npm run test:tools && npm run test:dcc && npm run build
    name: maintenance (${{ matrix.scope }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: matrix.scope == 'types'
        with:
          version: '0.11.8'
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
        if: matrix.scope == 'types'
      # Geometry and full rendering/export journeys are local completion gates.
      # Existing non-geometry checks run independently to target <2 minutes.
      - run: ${{ matrix.command }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-smoke-failures
          path: |
            test-results/browser
          retention-days: 14
