name: Full repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.8'
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
      - run: npm run check:full

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      # Private trace cases skip explicitly when their local evidence is unavailable.
      # Synthetic trace and every public application/delivery/export case still run.
      # Contact sheets are generated separately with test:browser:review.
      # Contiguous sharding would put all 29 long asset journeys on one runner.
      # Balance those through round-robin tags, then shard the other 123 cases.
      # Shared journeys run first to expose interaction failures before the bulk batch.
      - run: npm run test:browser -- --grep-invert=@asset-shard- --shard=${{ matrix.shard }}/3
      - run: npm run test:browser -- --grep=@asset-shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: maintenance-browser-failures-${{ matrix.shard }}
          path: test-results/browser
          retention-days: 14
