name: Asset build and release checks

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      browser: ${{ steps.select.outputs.browser }}
      geometry: ${{ steps.select.outputs.geometry }}
      browser_matrix: ${{ steps.select.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: inputs.plan == ''
      - id: select
        # Standalone calls select all public delivery and construction tests.
        run: node packages/workshop-tools/ci/asset-plan.ts
        env:
          CI_PLAN: ${{ inputs.plan }}

  geometry:
    needs: plan
    if: needs.plan.outputs.geometry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET_BUILD_CI: '1'
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - run: npm run ci -- run geometry

  browser-delivery:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run ci -- run browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: asset-browser-failures-${{ matrix.shard }}
          path: test-results/browser
          retention-days: 14
