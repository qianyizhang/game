name: Asset build and release checks

on:
  pull_request:
    paths: &asset_paths
      - 'src/**'
      - 'packages/**'
      - 'public/**'
      - 'tests/**'
      - 'maintenance/**'
      - 'skills/card-art/**'
      - 'docs/art/**'
      - 'docs/engineering/checks.md'
      - 'docs/engineering/asset-geometry-tests.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.nvmrc'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.npmrc'
      - '.gitattributes'
      - 'index.html'
      - '*.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths: *asset_paths
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: asset-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSET_BUILD_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - run: npm run test:geometry

  browser-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test --project=functional
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: asset-browser-failures
          path: test-results/browser
          retention-days: 14
