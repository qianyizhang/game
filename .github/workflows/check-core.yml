name: Safety core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: style
            command: npm run format:check && npm run lint:tools && npm run lint:app
          - scope: types
            command: npm run typecheck && npm run check:python
          - scope: contracts
            command: npm run test:tools && npm run test:dcc && npm run build
          - scope: simulations
            command: npm run playtest
          - scope: core-rules
            command: npm run ci -- core
          - scope: smoke
            command: npm run test:browser:smoke
    name: safety (${{ matrix.scope }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run maintenance -- check
      - run: npm ci
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: matrix.scope == 'types'
        with:
          version: '0.11.8'
          enable-cache: true
      - run: uv sync --locked
        if: matrix.scope == 'types'
      - run: npx playwright install --with-deps chrome
        if: matrix.scope == 'smoke'
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.scope == 'smoke'
        with:
          name: browser-smoke-failures
          path: test-results/browser
          retention-days: 14
