[project]
name = "card-workshop-checks"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "fake-bpy-module-4.5==20260730",
]

[tool.uv]
package = false
cache-dir = ".work/cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100
include = [
  "packages/dcc-workbench/blender/render_review.py",
  "packages/dcc-workbench/blender/review_plan.py",
  "packages/dcc-workbench/blender/test_review_plan.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "packages/dcc-workbench/blender/render_review.py",
  "packages/dcc-workbench/blender/review_plan.py",
  "packages/dcc-workbench/blender/test_review_plan.py",
]
