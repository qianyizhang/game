[project]
name = "card-workshop-checks"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.17.1",
  "mypy==2.4.0",
  "fake-bpy-module-5.2==20260730",
]

[tool.uv]
package = false
cache-dir = ".work/cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["packages/dcc-workbench/blender/*.py", "packages/dcc-workbench/subjects/canid/authoring/*.py", "packages/dcc-workbench/subjects/boar/authoring/*.py", "packages/dcc-workbench/subjects/raven/authoring/*.py", "packages/dcc-workbench/subjects/otter/authoring/*.py", "packages/dcc-workbench/subjects/night-passage/authoring/*.py"]

# Keep the Python 3.11 syntax subset for historical recipes; Blender 5.2 embeds Python 3.13.
[tool.ruff.per-file-target-version]
"packages/dcc-workbench/blender/*.py" = "py311"
"packages/dcc-workbench/subjects/canid/authoring/*.py" = "py311"
"packages/dcc-workbench/subjects/boar/authoring/*.py" = "py311"
"packages/dcc-workbench/subjects/raven/authoring/*.py" = "py311"
"packages/dcc-workbench/subjects/otter/authoring/*.py" = "py311"
"packages/dcc-workbench/subjects/night-passage/authoring/*.py" = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/dcc-workbench/blender", "packages/dcc-workbench/subjects/canid/authoring", "packages/dcc-workbench/subjects/boar/authoring", "packages/dcc-workbench/subjects/raven/authoring", "packages/dcc-workbench/subjects/otter/authoring", "packages/dcc-workbench/subjects/night-passage/authoring"]
